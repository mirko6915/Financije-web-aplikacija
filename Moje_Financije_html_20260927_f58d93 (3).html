<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6366f1">
<title>Moje financije</title>
<script>
(function(){
  try{
    var t = localStorage.getItem('financije_theme') || 'system';
    var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f9fafb; --surface-3:#f3f4f6;
    --border:#e5e7eb; --border-soft:#eef1f6;
    --text:#1a1d29; --text-muted:#6b7280; --text-dim:#9ca3af;
    --primary:#6366f1; --primary-hover:#4f46e5;
    --green:#10b981; --green-hover:#059669;
    --red:#ef4444; --red-hover:#dc2626;
    --purple:#8b5cf6; --purple-hover:#7c3aed;
    --amber:#f59e0b; --rose:#be123c;
    --shadow:0 1px 3px rgba(0,0,0,.04);
    --shadow-lg:0 2px 10px rgba(99,102,241,.15);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0f1115; --surface:#191c23; --surface-2:#1f232b; --surface-3:#252932;
    --border:#2a2e37; --border-soft:#23262e;
    --text:#e8eaf0; --text-muted:#9ca3af; --text-dim:#6b7280;
    --primary:#6366f1; --primary-hover:#4f46e5;
    --green:#34d399; --green-hover:#10b981;
    --red:#f87171; --red-hover:#ef4444;
    --purple:#a78bfa; --purple-hover:#8b5cf6;
    --amber:#fbbf24; --rose:#fb7185;
    --shadow:0 1px 3px rgba(0,0,0,.3);
    --shadow-lg:0 2px 10px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;padding-bottom:20px;transition:background .25s,color .25s}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:20px;font-weight:700}
  h1 span{color:var(--primary)}
  .header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);height:38px;padding:0 12px;border-radius:10px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;font-family:inherit;font-weight:600;transition:.15s}
  .icon-btn:hover{border-color:var(--primary);color:var(--primary)}
  .icon-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .theme-switch{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .theme-btn{background:none;border:none;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1;transition:.15s;font-family:inherit}
  .theme-btn:hover{background:var(--surface-3)}
  .theme-btn.active{background:var(--primary);box-shadow:0 1px 4px rgba(99,102,241,.4)}

  .year{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px}
  .year button{background:none;border:none;font-size:16px;cursor:pointer;padding:4px 10px;border-radius:6px;color:var(--text-muted);font-family:inherit}
  .year button:hover{background:var(--surface-3)}
  .year b{min-width:52px;text-align:center;font-size:15px}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:thin}
  .tabs::-webkit-scrollbar{height:6px}
  .tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:.15s;font-family:inherit}
  .tab:hover{border-color:var(--primary)}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 8px rgba(99,102,241,.3)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  @media(max-width:640px){.cards{gap:8px}}
  .card{background:var(--surface);border-radius:14px;padding:14px 16px;border:1px solid var(--border-soft);box-shadow:var(--shadow)}
  .card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:600;margin-bottom:6px}
  .card .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .card .sub{font-size:11px;color:var(--text-dim);margin-top:4px}
  .card.inc .val{color:var(--green)}
  .card.exp .val{color:var(--red)}
  .card.bal .val{color:var(--primary)}
  .card.bal.neg .val{color:var(--red)}
  .card.sav{background:linear-gradient(135deg,rgba(139,92,246,.10) 0%,var(--surface) 100%);border-color:rgba(139,92,246,.25)}
  .card.sav .val{color:var(--purple)}

  .panel{background:var(--surface);border-radius:14px;padding:18px;border:1px solid var(--border-soft);margin-bottom:16px;box-shadow:var(--shadow)}
  .panel h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;margin-bottom:14px}
  .panel h3{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 8px}
  .panel h3:first-child{margin-top:0}

  .quick-panel{background:linear-gradient(135deg,rgba(99,102,241,.07) 0%,var(--surface) 60%);border-color:rgba(99,102,241,.18)}
  .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:900px){.quick-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:440px){.quick-grid{grid-template-columns:1fr}}
  .quick-card{border:1px solid var(--border-soft);border-radius:12px;padding:12px;background:var(--surface);transition:.15s}
  .quick-card:hover{border-color:var(--primary);box-shadow:var(--shadow-lg)}
  .quick-card .qc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:13px;font-weight:700}
  .quick-card .qc-tag{font-size:10px;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  .quick-card.inc .qc-head{color:var(--green)}
  .quick-card.inc .qc-tag{background:rgba(16,185,129,.15);color:var(--green)}
  .quick-card.exp .qc-head{color:var(--red)}
  .quick-card.exp .qc-tag{background:rgba(239,68,68,.15);color:var(--red)}
  .quick-card.sav .qc-head{color:var(--purple)}
  .quick-card.sav .qc-tag{background:rgba(139,92,246,.15);color:var(--purple)}
  .quick-card .qc-row{display:flex;gap:6px}
  .quick-card input{padding:9px 11px;font-size:14px;flex:1;min-width:0}
  .quick-card button{color:#fff;border:none;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;background:var(--primary);transition:.15s}
  .quick-card.inc button{background:var(--green)}
  .quick-card.inc button:hover{background:var(--green-hover)}
  .quick-card.exp button{background:var(--red)}
  .quick-card.exp button:hover{background:var(--red-hover)}
  .quick-card.sav button{background:var(--purple)}
  .quick-card.sav button:hover{background:var(--purple-hover)}
  .quick-card .qc-note{font-size:11px;color:var(--text-dim);margin-top:7px;line-height:1.35}

  form.add{display:grid;grid-template-columns:110px 1fr 130px 1fr auto;gap:8px;align-items:end}
  @media(max-width:820px){form.add{grid-template-columns:1fr 1fr;gap:8px}
    form.add .f-desc{grid-column:1/-1}
    form.add .f-btn{grid-column:1/-1}
  }
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-weight:600;padding-left:2px}
  input,select{padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);width:100%}
  input::placeholder{color:var(--text-dim)}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
  input[type="checkbox"]{width:auto;padding:0}
  .toggle{display:flex;background:var(--surface-3);border-radius:10px;padding:3px}
  .toggle button{flex:1;border:none;background:none;padding:8px 4px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-muted);font-family:inherit}
  .toggle button.on.inc{background:var(--green);color:#fff}
  .toggle button.on.exp{background:var(--red);color:#fff}
  .btn-add{background:var(--primary);color:#fff;border:none;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
  .btn-add:hover{background:var(--primary-hover)}
  .btn-add.green{background:var(--green)}
  .btn-add.green:hover{background:var(--green-hover)}
  .btn-add.red{background:var(--red)}
  .btn-add.red:hover{background:var(--red-hover)}
  .btn-add.ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
  .btn-add.ghost:hover{border-color:var(--primary);color:var(--primary);background:transparent}
  .btn-add.done{background:var(--green);opacity:.55;cursor:not-allowed}
  .btn-add.done:hover{background:var(--green)}
  .btn-add:disabled{cursor:not-allowed}

  .txns{display:flex;flex-direction:column}
  .txn{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border-soft)}
  .txn:last-child{border-bottom:none}
  .txn .d{font-size:12px;color:var(--text-dim);min-width:52px;font-variant-numeric:tabular-nums}
  .txn .info{flex:1;min-width:0}
  .txn .desc{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .txn .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;margin-top:2px;margin-right:4px}
  .txn .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
  .txn .amt.inc{color:var(--green)}
  .txn .amt.exp{color:var(--red)}
  .txn .del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:6px;line-height:1;font-family:inherit}
  .txn .del:hover{color:var(--red);background:rgba(239,68,68,.1)}
  .empty{text-align:center;color:var(--text-dim);padding:24px 0;font-size:14px}

  .breakdown{display:flex;flex-direction:column;gap:10px}
  .bd-row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13px}
  .bd-row .nm{font-weight:600;color:var(--text-muted)}
  .bd-row .bar-bg{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden}
  .bd-row .bar-fill{height:100%;border-radius:4px;transition:width .3s}
  .bd-row .vv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}

  .barchart{display:flex;align-items:flex-end;gap:6px;height:180px;padding:0 4px;margin-bottom:8px}
  .bc-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:3px}
  .bc-pair{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
  .bc-bar{width:44%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
  .bc-bar.inc{background:var(--green)}
  .bc-bar.exp{background:var(--red)}
  .bc-lbl{font-size:11px;color:var(--text-dim);font-weight:600}
  .legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--text-muted);margin-bottom:16px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600}
  th{background:var(--surface-2);color:var(--text-muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
  th:first-child{background:var(--surface-2)}
  tr.tot td{font-weight:800;background:var(--surface-2);border-top:2px solid var(--border)}
  tr.tot td:first-child{background:var(--surface-2)}
  td.pos{color:var(--green)} td.neg{color:var(--red)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
  .toolbar button{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .toolbar button:hover{border-color:var(--primary);color:var(--primary)}

  /* Loan panel sklopiv */
  .loan-panel{background:linear-gradient(135deg,rgba(190,18,60,.05) 0%,var(--surface) 60%);border-color:rgba(190,18,60,.15)}
  .loan-panel .loan-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;user-select:none;margin:0}
  .loan-panel .loan-head h2{margin:0;color:var(--text-muted)}
  .loan-panel.expanded .loan-head{margin-bottom:14px}
  .loan-head .loan-summary{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text-dim);font-weight:600}
  .loan-head .loan-summary b{color:var(--rose);font-variant-numeric:tabular-nums}
  .collapse-arrow{font-size:11px;color:var(--text-dim);transition:transform .2s;display:inline-block;padding:4px 6px;border-radius:6px;background:var(--surface-3)}
  .loan-panel.expanded .collapse-arrow{transform:rotate(0deg)}
  .loan-panel:not(.expanded) .collapse-arrow{transform:rotate(-90deg)}
  .loan-head:hover .collapse-arrow{background:var(--surface-2);color:var(--primary)}
  .loan-body{overflow:hidden;transition:max-height .25s ease}
  .loan-panel:not(.expanded) .loan-body{display:none}

  /* Loan stats panel (Pregled) */
  .loan-stats-panel{background:linear-gradient(135deg,rgba(190,18,60,.04) 0%,var(--surface) 60%);border-color:rgba(190,18,60,.15)}
  .loan-stats-panel h2{color:var(--text-muted)}

  .loan-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
  @media(max-width:800px){.loan-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
  .loan-stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:600;margin-bottom:4px}
  .loan-stat .val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
  .loan-stat .val.rose{color:var(--rose)}
  .loan-stat .val.green{color:var(--green)}
  .loan-progress{height:12px;background:var(--surface-3);border-radius:6px;overflow:hidden;margin-bottom:8px;position:relative}
  .loan-progress-fill{height:100%;background:linear-gradient(90deg,var(--green) 0%,#22c55e 100%);border-radius:6px;transition:width .4s}
  .loan-progress-lbl{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:14px}
  .loan-actions{display:flex;gap:8px;flex-wrap:wrap}
  .loan-actions button{flex:1;min-width:160px}
  .loan-auto-info{background:rgba(99,102,241,.08);color:var(--text-muted);font-size:12px;padding:10px 12px;border-radius:9px;flex:1;min-width:200px;text-align:center;font-weight:600;border:1px solid rgba(99,102,241,.18);display:flex;align-items:center;justify-content:center;gap:6px}
  .loan-auto-info b{color:var(--primary);font-variant-numeric:tabular-nums}

  .sub-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .sub-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface-2);border-radius:10px;border:1px solid var(--border-soft)}
  .sub-item.off{opacity:.5}
  .sub-item .sinfo{flex:1;min-width:0}
  .sub-item .sname{font-size:14px;font-weight:600}
  .sub-item .smeta{font-size:11px;color:var(--text-dim);margin-top:2px}
  .sub-item .samt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--red);font-size:14px;white-space:nowrap}
  .sub-item .sbtn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px;font-family:inherit}
  .sub-item .sbtn:hover{color:var(--red);background:rgba(239,68,68,.1)}
  .sub-item .toggle-btn{background:none;border:1px solid var(--border);color:var(--text-muted);cursor:pointer;font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;font-family:inherit;text-transform:uppercase;letter-spacing:.03em}
  .sub-item .toggle-btn.on{background:var(--green);color:#fff;border-color:var(--green)}

  .grid-form{display:grid;grid-template-columns:1fr 130px 1fr 1fr 1fr auto;gap:8px;align-items:end}
  @media(max-width:900px){.grid-form{grid-template-columns:1fr 1fr;gap:8px}
    .grid-form .f-wide{grid-column:1/-1}
    .grid-form .f-btn{grid-column:1/-1}
  }

  .danger-zone{border-color:rgba(239,68,68,.3);background:linear-gradient(135deg,rgba(239,68,68,.05) 0%,var(--surface) 60%)}
  .danger-zone h2{color:var(--red)}

  .watermark{text-align:center;padding:32px 16px 20px;color:var(--text-dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.65}
  .watermark .diamond{color:var(--primary);margin:0 10px;font-size:10px;opacity:.7}

  .hint{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.35}
  .opt{font-size:10px;color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>💰 Moje <span>financije</span></h1>
    <div class="header-right">
      <button class="icon-btn" id="moreBtn" onclick="go('settings')" title="Više">⚙️ Više</button>
      <div class="theme-switch" title="Tema prikaza">
        <button class="theme-btn" data-t="light"  onclick="setTheme('light')"  title="Svijetla tema">☀️</button>
        <button class="theme-btn" data-t="dark"   onclick="setTheme('dark')"   title="Tamna tema">🌙</button>
        <button class="theme-btn" data-t="system" onclick="setTheme('system')" title="Prema sustavu">🌗</button>
      </div>
      <div class="year">
        <button onclick="changeYear(-1)">‹</button>
        <b id="yearLbl">2026</b>
        <button onclick="changeYear(1)">›</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>

  <footer class="watermark">
    <span class="diamond">✦</span> Daidala Ergasterion <span class="diamond">✦</span>
  </footer>

</div>

<script>
/* ================= KONFIGURACIJA ================= */
const MONTHS = ['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];
const SHORT  = ['Sij','Vel','Ožu','Tra','Svi','Lip','Srp','Kol','Ruj','Lis','Stu','Pro'];
const CATS = {
  prihod: ['Plaća','Manča','Fatureta','Ostalo'],
  rashod: ['Pretplate','Hrana','Gorivo','Kava','Štednja','Kredit','Ostalo']
};
const COLORS = {
  'prihod:Plaća':'#3b82f6','prihod:Manča':'#06b6d4','prihod:Fatureta':'#0ea5e9','prihod:Ostalo':'#94a3b8',
  'rashod:Pretplate':'#8b5cf6','rashod:Hrana':'#f59e0b','rashod:Gorivo':'#ef4444',
  'rashod:Kava':'#a16207','rashod:Štednja':'#8b5cf6','rashod:Kredit':'#be123c','rashod:Ostalo':'#94a3b8'
};
const SAVINGS_CAT = 'Štednja';
const LOAN_CAT = 'Kredit';
const FREQ_LBL = {1:'Svaki mjesec',2:'Svaka 2 mj.',3:'Kvartalno (3 mj)',6:'Polugodišnje (6 mj)',12:'Godišnje'};

/* ================= TEMA ================= */
const THEME_KEY = 'financije_theme';
let themePref = localStorage.getItem(THEME_KEY) || 'system';

function applyTheme(){
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = themePref === 'dark' || (themePref === 'system' && sysDark);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', dark ? '#0f1115' : '#f4f6fb');
  document.querySelectorAll('.theme-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.t === themePref);
  });
}
function setTheme(t){ themePref = t; localStorage.setItem(THEME_KEY, t); applyTheme(); }
try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(themePref === 'system') applyTheme();
  });
}catch(e){}

/* ================= STANJE ================= */
const LS_KEY = 'financije_v1';
const LOAN_UI_KEY = 'financije_loan_collapsed';

let state = { year: new Date().getFullYear(), txns: {}, subscriptions: [], loan: null };
let currentView = 'pregled';
let formType = 'rashod';

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state = Object.assign({year:new Date().getFullYear(), txns:{}, subscriptions:[], loan:null}, d);
    }
  }catch(e){ console.warn(e); }
  if(state.loan && !state.loan.nextPaymentDate && state.loan.startDate){
    state.loan.nextPaymentDate = state.loan.startDate;
  }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function isLoanCollapsed(){
  const v = localStorage.getItem(LOAN_UI_KEY);
  return v === null ? true : v === '1';
}
function toggleLoanPanel(){
  localStorage.setItem(LOAN_UI_KEY, isLoanCollapsed() ? '0' : '1');
  render();
}

/* ================= POMOĆNE ================= */
const uid = () => Date.now()+'_'+Math.random().toString(36).slice(2,7);
const mKey = (y,m) => `${y}-${String(m+1).padStart(2,'0')}`;
const getTx = (y,m) => state.txns[mKey(y,m)] || [];
const setTx = (y,m,a) => { state.txns[mKey(y,m)] = a; save(); };
const eur = n => new Intl.NumberFormat('hr-HR',{style:'currency',currency:'EUR'}).format(n||0);

function parseAmount(v){
  let s = String(v).trim().replace(/\s/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  return parseFloat(s) || 0;
}
function defaultDate(m){
  const t = new Date();
  if(t.getFullYear()===state.year && t.getMonth()===m){
    return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  }
  return `${state.year}-${String(m+1).padStart(2,'0')}-01`;
}
function addMonth(dateStr){
  if(!dateStr) return dateStr;
  const [y, m, d] = dateStr.split('-').map(Number);
  const nd = new Date(y, m, Math.min(Math.max(1, d||1), 28));
  return `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-${String(nd.getDate()).padStart(2,'0')}`;
}
function subMonth(dateStr){
  if(!dateStr) return dateStr;
  const [y, m, d] = dateStr.split('-').map(Number);
  const nd = new Date(y, m-2, Math.min(Math.max(1, d||1), 28));
  return `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-${String(nd.getDate()).padStart(2,'0')}`;
}
function fmtMonthHR(dateStr){
  if(!dateStr) return '—';
  const [y, m] = dateStr.split('-').map(Number);
  return `${MONTHS[m-1]} ${y}.`;
}
function summarize(txns){
  const s = { prihod:0, rashod:0, cats:{}, count:0 };
  for(const t of txns){
    const a = Number(t.amount)||0;
    s.count++;
    if(t.type==='prihod') s.prihod += a; else s.rashod += a;
    const k = t.type+':'+t.category;
    s.cats[k] = (s.cats[k]||0) + a;
  }
  s.saldo = s.prihod - s.rashod;
  return s;
}
function getSavingsTotal(){
  let total = 0;
  for(const key in state.txns){
    for(const t of state.txns[key]){
      if(t.type==='rashod' && t.category===SAVINGS_CAT) total += Number(t.amount)||0;
    }
  }
  return total;
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getRegularPaymentThisMonth(){
  const now = new Date();
  const ym = mKey(now.getFullYear(), now.getMonth());
  const txns = state.txns[ym] || [];
  return txns.find(t => t.loanId === 'main' && /redovna/i.test(t.desc || ''));
}

/* ================= PRETPLATE ================= */
function applySubscriptions(y, m){
  let changed = false;
  const ym = mKey(y,m);
  for(const sub of state.subscriptions){
    if(!sub.active) continue;
    if(!sub.appliedMonths) sub.appliedMonths = [];
    if(sub.appliedMonths.includes(ym)) continue;
    const [sy, sm] = (sub.startDate||`${y}-01-01`).split('-').map(Number);
    const startIdx = sy*12 + (sm-1);
    const curIdx = y*12 + m;
    const diff = curIdx - startIdx;
    if(diff < 0) continue;
    if(diff % sub.intervalMonths !== 0) continue;
    const day = Math.min(28, Math.max(1, Number((sub.startDate||'').slice(8,10)) || 1));
    const date = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const arr = state.txns[ym] = state.txns[ym] || [];
    arr.push({ id: uid(), date, desc: sub.name, amount: sub.amount, category: sub.category, type: sub.type, subId: sub.id });
    sub.appliedMonths.push(ym);
    changed = true;
  }
  if(changed) save();
}

/* ================= KREDIT ================= */
// Pokušaj primijeniti redovnu ratu za TOČNO mjesec (y, m) — samo ako je to mjesec sljedeće rate.
// Primjenjuje se kad: kalendar je stigao do tog mjeseca ILI postoji prihod u tom mjesecu.
function applyLoanMonthly(y, m){
  const L = state.loan;
  if(!L || !L.autoMonthly || L.remaining <= 0) return false;
  if(!L.nextPaymentDate) return false;

  const [ny, nm] = L.nextPaymentDate.split('-').map(Number);
  const nextIdx = ny*12 + (nm-1);
  const curIdx = y*12 + m;

  if(curIdx !== nextIdx) return false;

  const realNow = new Date();
  const realIdx = realNow.getFullYear()*12 + realNow.getMonth();
  const calendarArrived = curIdx <= realIdx;

  const ym = mKey(y, m);
  const monthTx = state.txns[ym] || [];
  const hasIncome = monthTx.some(t => t.type === 'prihod');

  if(!calendarArrived && !hasIncome) return false;

  if(monthTx.some(t => t.loanId === 'main' && /redovna/i.test(t.desc || ''))){
    // Sigurnosna kopija — ako već postoji, pomakni nextPaymentDate i izađi
    L.nextPaymentDate = addMonth(L.nextPaymentDate);
    save();
    return false;
  }

  const day = Math.min(28, Math.max(1, parseInt((L.nextPaymentDate||'').slice(8,10)) || 1));
  const date = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const amount = Math.min(L.annuity, L.remaining);

  const arr = state.txns[ym] = state.txns[ym] || [];
  arr.push({ id: uid(), date, desc: 'Kredit — redovna rata', amount, category: LOAN_CAT, type: 'rashod', loanId: 'main' });

  L.remaining = Math.max(0, L.remaining - amount);
  if(L.installmentsRemaining != null && L.installmentsRemaining > 0) L.installmentsRemaining--;
  L.nextPaymentDate = addMonth(L.nextPaymentDate);
  L.payments = L.payments || [];
  L.payments.push({ id: uid(), date, amount, type: 'regular', ym });
  save();
  return true;
}

// Prođi kroz sve mjesece od sljedeće rate do STVARNOG trenutnog mjeseca i primijeni sve zakašnjele rate
function ensureLoanPayments(){
  const L = state.loan;
  if(!L || !L.autoMonthly || L.remaining <= 0) return false;
  if(!L.nextPaymentDate) return false;

  let changed = false;
  const realNow = new Date();
  const realIdx = realNow.getFullYear()*12 + realNow.getMonth();
  let safety = 0;

  while(L.remaining > 0 && safety < 600){
    const [ny, nm] = L.nextPaymentDate.split('-').map(Number);
    const nextIdx = ny*12 + (nm-1);
    if(nextIdx > realIdx) break;

    const y = Math.floor(nextIdx / 12);
    const m = nextIdx % 12;
    const ym = mKey(y, m);
    const monthTx = state.txns[ym] || [];

    if(monthTx.some(t => t.loanId === 'main' && /redovna/i.test(t.desc || ''))){
      // Rate za taj mjesec već postoji — samo pomakni nextPaymentDate
      L.nextPaymentDate = addMonth(L.nextPaymentDate);
      save();
      safety++;
      continue;
    }

    if(applyLoanMonthly(y, m)){
      changed = true;
    } else {
      break;
    }
    safety++;
  }
  return changed;
}

// Mjesec u koji ide izvanredna uplata (ako smo u pregledu → stvarni mjesec)
function extraPaymentMonth(){
  if(typeof currentView === 'number') return { y: state.year, m: currentView };
  const now = new Date();
  return { y: now.getFullYear(), m: now.getMonth() };
}

}

/* ---------- PREGLED ---------- */
function renderOverview(){
  let totInc=0, totExp=0, totCount=0;
  const rows = MONTHS.map((name,i)=>{
    const txns = getTx(state.year,i);
    const s = summarize(txns);
    totInc += s.prihod; totExp += s.rashod; totCount += s.count;
    return {name, s};
  });

  const activeMonths = rows.filter(r => r.s.count > 0).length || 1;
  const avgInc = totInc / activeMonths;
  const avgExp = totExp / activeMonths;

  const catTotals = {};
  rows.forEach(r => {
    for(const k in r.s.cats){
      if(k.startsWith('rashod:')){
        catTotals[k] = (catTotals[k]||0) + r.s.cats[k];
      }
    }
  });
  let biggest = '—', biggestVal = 0;
  for(const k in catTotals){ if(catTotals[k] > biggestVal){ biggestVal = catTotals[k]; biggest = k.split(':')[1]; } }

  const maxVal = Math.max(1, ...rows.map(r=>Math.max(r.s.prihod, r.s.rashod)));
  let chart = '<div class="barchart">';

    const hi = Math.round((r.s.prihod/maxVal)*100);

        <div class="bc-bar inc" style="height:${hi}%"></div>
        <div class="bc-bar exp" style="height:${he}%"></div>

  rows.forEach(r=>{ chart += `<div class="bc-col"><div class="bc-lbl">${SHORT[MONTHS.indexOf(r.name)]}</div></div>`; });

        </div>

              onkeydown="if(event.key==='Enter'){event.preventDefault();quickAdd('rashod','Gorivo','q_gorivo')}">

/* ================= AKCIJE ================= */
function go(v){
  currentView = v;
  window._editingLoan = false;
  ensureLoanPayments(); // provjeri zakašnjele auto-rate (u slučaju promjene datuma)
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function changeYear(d){ state.year += d; save(); ensureLoanPayments(); render(); }
function setType(t,m){ formType = t; render(); }

function quickAdd(type, category, inputId){
  const m = currentView;
  if(typeof m !== 'number') return;
  const inp = document.getElementById(inputId);
  if(!inp) return;
  const amount = parseAmount(inp.value);
  if(!amount){ inp.focus(); return; }

  const arr = getTx(state.year,m);
  arr.push({ id: uid(), date: defaultDate(m), desc: category, amount, category, type });
  setTx(state.year,m,arr);

  // Ako je prihod, provjeri auto-ratu
  if(type === 'prihod'){
    ensureLoanPayments();
    applyLoanMonthly(state.year, m);
  }

  inp.value = '';
  render();
  setTimeout(()=>{ const el = document.getElementById(inputId); if(el) el.focus(); }, 40);
}

function addTxn(e,m){
  e.preventDefault();
  const f = e.target;
  const amount = parseAmount(f.amount.value);
  if(!amount){ f.amount.focus(); return; }

  const arr = getTx(state.year,m);
  arr.push({
    id: uid(),
    date: f.date.value || defaultDate(m),
    desc: f.desc.value.trim(),
    amount,
    category: f.category.value,
    type: formType
  });
  setTx(state.year,m,arr);

  if(formType === 'prihod'){
    ensureLoanPayments();
    applyLoanMonthly(state.year, m);
  }

  f.reset();
  f.date.value = defaultDate(m);
  render();
  setTimeout(()=>{ const el=document.querySelector('input[name="desc"]'); if(el) el.focus(); },50);
}

function delTxn(id){
  const m = currentView;
  if(typeof m !== 'number') return;
  if(!confirm('Obrisati ovu transakciju?')) return;
  setTx(state.year, m, getTx(state.year,m).filter(t=>t.id!==id));
  render();
}

/* --- Pretplate --- */
function addSub(e){
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  const amount = parseAmount(f.amount.value);
  const intervalMonths = Number(f.intervalMonths.value);
  const startMonth = f.startDate.value || new Date().toISOString().slice(0,7);
  if(!name || !amount) return;
  state.subscriptions.push({
    id: uid(), name, amount, category: f.category.value,
    intervalMonths, startDate: startMonth+'-01', active: true, appliedMonths: []
  });
  save(); render();
}
function delSub(id){
  if(!confirm('Obrisati ovu pretplatu? (Postojeće transakcije ostaju.)')) return;
  state.subscriptions = state.subscriptions.filter(s=>s.id!==id);
  save(); render();
}
function toggleSub(id){
  const s = state.subscriptions.find(x=>x.id===id);
  if(!s) return;
  s.active = !s.active;
  save(); render();
}

/* --- Kredit --- */
function saveLoan(e){
  e.preventDefault();
  const f = e.target;
  const orig = parseAmount(f.originalTotal.value);
  const rem = parseAmount(f.remaining.value);
  const ann = parseAmount(f.annuity.value);
  if(!orig || !ann || rem < 0) return;

  const remCalc = Math.max(1, Math.ceil(rem / ann));
  const remI = parseInt(f.installmentsRemaining.value, 10) || remCalc;
  const tot = parseInt(f.installmentsTotal.value, 10) || remI;

  const nextDate = f.nextPaymentDate.value || new Date().toISOString().slice(0,10);

  if(!state.loan){
    state.loan = { payments: [] };
  }
  state.loan.name = f.name.value.trim() || 'Kredit';
  state.loan.originalTotal = orig;
  state.loan.remaining = Math.max(0, rem);
  state.loan.annuity = ann;
  state.loan.installmentsTotal = tot;
  state.loan.installmentsRemaining = Math.max(0, remI);
  state.loan.nextPaymentDate = nextDate;
  state.loan.autoMonthly = f.autoMonthly.checked;
  delete state.loan.startDate;
  delete state.loan.appliedMonths;

  window._editingLoan = false;
  save();
  ensureLoanPayments(); // odmah primijeni eventualne zakašnjele rate
  render();
}
function editLoan(){ window._editingLoan = true; render(); }
function clearLoan(){
  if(!confirm('Obrisati podatke o kreditu? Postojeće transakcije s kategorijom Kredit ostaju.')) return;
  state.loan = null;
  save(); render();
}

// REDOVNA RATA — samo za tekući stvarni mjesec
function payRegular(){
  const L = state.loan;
  if(!L) return;
  if(L.autoMonthly){
    alert('Automatska rata je uključena. Isključi ju u „Više" ako želiš ručno uplaćivati.');
    return;
  }
  if(getRegularPaymentThisMonth()){
    alert('Rata za ovaj mjesec je već uplaćena.');
    return;
  }
  const now = new Date();
  const ym = mKey(now.getFullYear(), now.getMonth());
  const amount = Math.min(L.annuity, L.remaining);
  if(amount <= 0){ alert('Kredit je već otplaćen.'); return; }

  const monthName = MONTHS[now.getMonth()];
  const nextAfter = L.nextPaymentDate ? fmtMonthHR(addMonth(L.nextPaymentDate)) : '—';
  const msg = `Uplati redovnu ratu za ${monthName} ${now.getFullYear()}?\n\nIznos: ${eur(amount)}\n\nNakon uplate:\n• Preostalo: ${eur(Math.max(0, L.remaining - amount))}\n• Sljedeća rata: ${nextAfter}`;
  if(!confirm(msg)) return;

  const day = Math.min(28, Math.max(1, now.getDate()));
  const date = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const arr = state.txns[ym] = state.txns[ym] || [];
  arr.push({ id: uid(), date, desc: 'Kredit — redovna rata', amount, category: LOAN_CAT, type: 'rashod', loanId: 'main' });

  L.remaining = Math.max(0, L.remaining - amount);
  if(L.installmentsRemaining != null && L.installmentsRemaining > 0) L.installmentsRemaining--;
  if(L.nextPaymentDate) L.nextPaymentDate = addMonth(L.nextPaymentDate);
  L.payments = L.payments || [];
  L.payments.push({ id: uid(), date, amount, type: 'regular', ym });
  save();
  render();
}

// PONIŠTI uplatu redovne rate za tekući mjesec
function undoRegularPayment(){
  const L = state.loan;
  if(!L) return;
  const existing = getRegularPaymentThisMonth();
  if(!existing){ alert('Nema uplaćene rate za ovaj mjesec.'); return; }
  const now = new Date();
  const monthName = MONTHS[now.getMonth()];
  const msg = `Poništiti uplatu redovne rate za ${monthName}?\n\nIznos: ${eur(existing.amount)}\n\n• Transakcija će biti obrisana\n• Dug će se vratiti na ${eur(L.remaining + existing.amount)}\n• Sljedeća rata: ${L.nextPaymentDate ? fmtMonthHR(subMonth(L.nextPaymentDate)) : '—'}`;
  if(!confirm(msg)) return;

  const ym = mKey(now.getFullYear(), now.getMonth());
  state.txns[ym] = (state.txns[ym] || []).filter(t => t.id !== existing.id);

  L.remaining = (L.remaining || 0) + existing.amount;
  if(L.installmentsRemaining != null) L.installmentsRemaining++;
  if(L.nextPaymentDate) L.nextPaymentDate = subMonth(L.nextPaymentDate);
  L.payments = (L.payments || []).filter(p => p.id !== existing.id);
  save();
  render();
  alert('Uplata je poništena. Dug i broj rata vraćeni.');
}

// IZVANREDNA uplata — ide u trenutni pregledani mjesec (ili stvarni ako smo u Pregledu)
function payExtra(){
  const L = state.loan;
  if(!L) return;
  const inp = prompt(`Trenutno preostalo: ${eur(L.remaining)}\n\nUnesi iznos izvanredne uplate (€):`);
  if(inp === null) return;
  const amount = parseAmount(inp);
  if(!amount || amount <= 0) return;
  if(amount > L.remaining){
    if(!confirm(`Iznos (${eur(amount)}) je veći od preostalog duga (${eur(L.remaining)}).\n\nNastaviti? (Kredit će se smatrati otplaćenim.)`)) return;
  }
  const { y, m } = extraPaymentMonth();
  const ym = mKey(y, m);
  const day = Math.min(28, Math.max(1, new Date().getDate()));
  const date = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const actual = Math.min(amount, L.remaining);

  const arr = state.txns[ym] = state.txns[ym] || [];
  arr.push({ id: uid(), date, desc: 'Kredit — izvanredna uplata', amount: actual, category: LOAN_CAT, type: 'rashod', loanId: 'main' });

  L.remaining = Math.max(0, L.remaining - actual);
  L.payments = L.payments || [];
  L.payments.push({ id: uid(), date, amount: actual, type: 'extra', ym });
  save();
  render();
}

/* --- Reset --- */
function resetAll(){
  if(!confirm('⚠️ PAŽNJA!\n\nOvo će trajno obrisati SVE podatke:\n• Sve transakcije\n• Sve pretplate\n• Podatke o kreditu\n• Sve postavke\n\nJesi li siguran da želiš nastaviti?')) return;
  if(!confirm('JESI LI POTPUNO SIGURAN?\n\nOva radnja se NE MOŽE poništiti i svi podaci bit će izgubljeni zauvijek.\n\nPreporučujemo da prvo napraviš Backup!')){
    return;
  }
  const t = prompt('Za konačnu potvrdu upiši velikim slovima: OBRIŠI');
  if(t !== 'OBRIŠI'){
    alert('Nisi upisao ispravnu riječ. Reset otkazan.');
    return;
  }
  localStorage.removeItem(LS_KEY);
  state = { year: new Date().getFullYear(), txns: {}, subscriptions: [], loan: null };
  save();
  currentView = 'pregled';
  render();
  alert('Svi podaci su obrisani. Kreni ispočetka.');
}

/* ================= EXPORT / IMPORT ================= */
function exportCSV(){
  let csv = 'Datum,Mjesec,Tip,Kategorija,Opis,Iznos (EUR)\n';
  MONTHS.forEach((name,i)=>{
    getTx(state.year,i).forEach(t=>{
      csv += [t.date||'', name, t.type==='prihod'?'Prihod':'Rashod', t.category,
              '"'+String(t.desc||'').replace(/"/g,'""')+'"',
              String(t.amount).replace('.',',')].join(',')+'\n';
    });
  });
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `financije_${state.year}.csv`;
  a.click();
}
function backupJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `financije_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function restoreJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.txns) throw new Error('Neispravna datoteka');
      if(confirm('Ovo će zamijeniti sve trenutne podatke. Nastaviti?')){
        state = Object.assign({year:new Date().getFullYear(), txns:{}, subscriptions:[], loan:null}, data);
        save(); render();
      }
    }catch(err){ alert('Greška: '+err.message); }
  };
  r.readAsText(file);
  e.target.value = '';
}

/* ================= START ================= */
load();
applyTheme();

const now = new Date();
currentView = (now.getFullYear() === state.year) ? now.getMonth() : 'pregled';

// Pretplate — samo za tekući stvarni mjesec
applySubscriptions(now.getFullYear(), now.getMonth());

// Kredit — provjeri SVE zakašnjele rate do stvarnog trenutnog mjeseca
ensureLoanPayments();

render();
</script>
